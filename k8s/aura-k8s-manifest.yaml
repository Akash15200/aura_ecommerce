apiVersion: v1
kind: Namespace
metadata:
  name: aura-ecommerce
---
# --- COMMON CONFIGURATIONS MAP ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-config
  namespace: aura-ecommerce
data:
  POSTGRES_DB: "ecommerce"
  POSTGRES_USER: "aura_user"
  POSTGRES_PASSWORD: "aura_password_123"
  REDIS_HOST: "aura-redis-service"
  MONGO_URI: "mongodb://aura-mongo-service:27017/ecommerce"
  ELASTICSEARCH_URIS: "http://aura-elasticsearch-service:9200"
  KAFKA_BOOTSTRAP_SERVERS: "aura-kafka-service:9092"
  EUREKA_ZONE: "http://aura-discovery-service:8761/eureka/"
---
# --- POSTGRES DATABASE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-postgres
  namespace: aura-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-postgres
  template:
    metadata:
      labels:
        app: aura-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: aura-postgres-service
  namespace: aura-ecommerce
spec:
  ports:
    - port: 5432
  selector:
    app: aura-postgres
---
# --- REDIS CACHE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-redis
  namespace: aura-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-redis
  template:
    metadata:
      labels:
        app: aura-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: aura-redis-service
  namespace: aura-ecommerce
spec:
  ports:
    - port: 6379
  selector:
    app: aura-redis
---
# --- SPRING CLOUD DISCOVERY (EUREKA) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-discovery
  namespace: aura-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-discovery
  template:
    metadata:
      labels:
        app: aura-discovery
    spec:
      containers:
        - name: discovery-server
          image: aura-discovery-server:latest
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: aura-discovery-service
  namespace: aura-ecommerce
spec:
  ports:
    - port: 8761
  selector:
    app: aura-discovery
---
# --- SPRING CLOUD API GATEWAY ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-gateway
  namespace: aura-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aura-gateway
  template:
    metadata:
      labels:
        app: aura-gateway
    spec:
      containers:
        - name: api-gateway
          image: aura-api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: EUREKA_ZONE
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: REDIS_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: aura-gateway-service
  namespace: aura-ecommerce
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: aura-gateway
---
# --- AUTH MICROSERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-auth
  namespace: aura-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aura-auth
  template:
    metadata:
      labels:
        app: aura-auth
    spec:
      containers:
        - name: auth-service
          image: aura-auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: EUREKA_ZONE
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://aura-postgres-service:5432/ecommerce"
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: REDIS_HOST
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: aura-config
                  key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: aura-auth-service
  namespace: aura-ecommerce
spec:
  ports:
    - port: 8081
  selector:
    app: aura-auth
