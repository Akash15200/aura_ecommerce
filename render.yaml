databases:
  - name: aura-db
    plan: free

services:
  # ----------------------------------------------------
  # 1. Discovery Server (Eureka)
  # ----------------------------------------------------
  - type: web
    name: aura-discovery-server
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/discovery-server/Dockerfile
    envVars:
      - key: PORT
        value: 8761

  # ----------------------------------------------------
  # 2. API Gateway
  # ----------------------------------------------------
  - type: web
    name: aura-api-gateway
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/api-gateway/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false # e.g. https://aura-auth-service-tubk.onrender.com
      - key: PRODUCT_SERVICE_URL
        sync: false # e.g. https://aura-product-service-tubk.onrender.com
      - key: ORDER_SERVICE_URL
        sync: false # e.g. https://aura-order-service-tubk.onrender.com
      - key: REVIEW_SERVICE_URL
        sync: false # e.g. https://aura-review-service-tubk.onrender.com
      - key: RECOMMENDATION_SERVICE_URL
        sync: false # e.g. https://aura-recommendation-service-tubk.onrender.com
      - key: ANALYTICS_SERVICE_URL
        sync: false # e.g. https://aura-analytics-service-tubk.onrender.com

  # ----------------------------------------------------
  # 3. Auth Service
  # ----------------------------------------------------
  - type: web
    name: aura-auth-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/auth-service/Dockerfile
    envVars:
      - key: PORT
        value: 8081
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: aura-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: aura-db
          property: port
      - key: DATABASE_DB
        fromDatabase:
          name: aura-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: aura-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: aura-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: JWT_SECRET
        value: YXVyYV9zdXBlcl9zZWN1cmVfc2VjcmV0X2tleV90aGF0X2lzX2xvbmdfZW5vdWdoX2Zvcl9zaGEyNTY=

  # ----------------------------------------------------
  # 4. Product Service
  # ----------------------------------------------------
  - type: web
    name: aura-product-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/product-service/Dockerfile
    envVars:
      - key: PORT
        value: 8082
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: aura-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: aura-db
          property: port
      - key: DATABASE_DB
        fromDatabase:
          name: aura-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: aura-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: aura-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_ELASTICSEARCH_URIS
        sync: false

  # ----------------------------------------------------
  # 5. Order Service
  # ----------------------------------------------------
  - type: web
    name: aura-order-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/order-service/Dockerfile
    envVars:
      - key: PORT
        value: 8083
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: aura-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: aura-db
          property: port
      - key: DATABASE_DB
        fromDatabase:
          name: aura-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: aura-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: aura-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: PRODUCT_SERVICE_URL
        sync: false # e.g. https://aura-product-service-tubk.onrender.com

  # ----------------------------------------------------
  # 6. Review Service
  # ----------------------------------------------------
  - type: web
    name: aura-review-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/review-service/Dockerfile
    envVars:
      - key: PORT
        value: 8085
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_DATA_MONGODB_URI
        sync: false

  # ----------------------------------------------------
  # 7. Recommendation Service
  # ----------------------------------------------------
  - type: web
    name: aura-recommendation-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/recommendation-service/Dockerfile
    envVars:
      - key: PORT
        value: 8086
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: PRODUCT_SERVICE_URL
        sync: false # e.g. https://aura-product-service-tubk.onrender.com

  # ----------------------------------------------------
  # 8. Analytics Service
  # ----------------------------------------------------
  - type: web
    name: aura-analytics-service
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/analytics-service/Dockerfile
    envVars:
      - key: PORT
        value: 8088
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_DATA_MONGODB_URI
        sync: false
