input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [logger_name] =~ "com.aura" {
    mutate {
      add_tag => [ "aura-microservice-core" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "aura-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
