server:
  port: 8081

spring:
  session:
    store-type: none  # Disable Redis-backed Spring Session to allow STATELESS JWT auth
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aura_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: userCreated:com.aura.auth.event.UserCreatedEvent

jwt:
  secret: YXVyYV9zdXBlcl9zZWN1cmVfc2VjcmV0X2tleV90aGF0X2lzX2xvbmdfZW5vdWdoX2Zvcl9zaGEyNTY=
  access-expiration: 3600000       # 1 hour
  refresh-expiration: 604800000     # 7 days

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
